<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a2e3a" />
    <meta
      name="description"
      content="Conheça a vitrine LumaLab e os kits com quatro bottons de 44 mm • 4,4 cm."
    />
    <script>
      (() => {
        let tema;
        try {
          tema = localStorage.getItem("lumalab-tema");
        } catch {}
        if (!["claro", "escuro"].includes(tema))
          tema = matchMedia("(prefers-color-scheme: dark)").matches
            ? "escuro"
            : "claro";
        document.documentElement.dataset.tema = tema;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", tema === "escuro" ? "#0d1422" : "#7a2e3a");
      })();
    </script>
    <title>LumaLab — pequenas peças, muita personalidade</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/principal.jsx"></script>
  </body>
</html>
